<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="page.title">Image Gallery</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>

  <body>
    <header>
      <div class="header-top">
        <!-- フィルター前の件数 -->
        <p id="info"></p>

        <div class="lang-select">
          <label for="locale-select" data-i18n="lang.label">Language</label>
          <select
            id="locale-select"
            data-i18n="lang.label"
            data-i18n-attr="aria-label"
          >
            <option value="en" data-i18n="lang.en">English</option>
            <option value="ja" data-i18n="lang.ja">日本語</option>
          </select>
        </div>
      </div>

      <div id="notices" class="notices" hidden></div>

      <!-- 適用中のフィルター情報 -->
      <div id="filter-summary">
        <p id="filter-info"></p>
        <p id="visible-count"></p>
      </div>

      <!-- フィルター -->
      <div class="filters">
        <div class="size-filter-group">
          <p class="size-filter-title" data-i18n="filter.minSizeTitle">
            Minimum size (px)
          </p>

          <div class="size-filter-row">
            <label class="size-filter-input" data-i18n="filter.width">
              Width
              <input
                type="number"
                id="min-width"
                min="0"
                step="1"
                value="400"
                inputmode="numeric"
              />
            </label>
            <label class="size-filter-input" data-i18n="filter.height">
              Height
              <input
                type="number"
                id="min-height"
                min="0"
                step="1"
                value="400"
                inputmode="numeric"
              />
            </label>
            <button id="apply-size-filter" data-i18n="filter.apply">
              Apply
            </button>
            <button
              id="clear-size-filter"
              type="button"
              data-i18n="filter.clear"
            >
              Clear
            </button>
          </div>
        </div>

        <div class="ext-filter-group">
          <p class="ext-filter-title" data-i18n="filter.extTitle">
            File type filter
          </p>

          <div class="ext-filter-row">
            <label data-i18n="filter.hideSvg">
              <input type="checkbox" id="filter-svg" />
              Hide SVG
            </label>
            <label data-i18n="filter.hideGif">
              <input type="checkbox" id="filter-gif" />
              Hide GIF
            </label>
          </div>
        </div>
      </div>
    </header>

    <main>
      <!-- 画像を並べる領域 -->
      <section class="grid" id="grid"></section>
    </main>

    <div id="modal" class="hidden">
      <div id="overlay"></div>
      <img id="modal-img" />

      <!-- ✕ボタン -->
      <button
        id="close-btn"
        data-i18n="modal.close"
        data-i18n-attr="aria-label"
      >
        <svg
          id="close-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="square"
          stroke-linejoin="arcs"
        >
          <!-- 背景＋白枠線 -->
          <rect width="24" height="24" fill="black" stroke="#ffffff" />

          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- 前の画像 -->
      <button
        id="prev-btn"
        type="button"
        class="nav-btn"
        data-i18n="modal.prev"
        data-i18n-attr="aria-label"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="square"
          stroke-linejoin="arcs"
        >
          <rect width="24" height="24" fill="black" stroke="#ffffff" />
          <polyline points="14 6 8 12 14 18" />
        </svg>
      </button>

      <!-- 次の画像 -->
      <button
        id="next-btn"
        type="button"
        class="nav-btn"
        data-i18n="modal.next"
        data-i18n-attr="aria-label"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="square"
          stroke-linejoin="arcs"
        >
          <rect width="24" height="24" fill="black" stroke="#ffffff" />
          <polyline points="10 6 16 12 10 18" />
        </svg>
      </button>

      <!-- 拡大／縮小切り替え -->
      <button id="zoom-btn">
        <!-- 拡大アイコン（次アクション: 原寸大） -->
        <svg
          id="zoom-in-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="square"
          stroke-linejoin="arcs"
        >
          <!-- 背景＋白枠線 -->
          <rect width="24" height="24" fill="black" stroke="#ffffff" />

          <!-- 外向き矢印 -->
          <path d="M15 3h6v6M14 10l6.1-6.1M9 21H3v-6M10 14l-6.1 6.1" />
        </svg>

        <!-- 縮小アイコン（次アクション: 画面に合わせる） -->
        <svg
          id="zoom-out-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="square"
          stroke-linejoin="arcs"
        >
          <!-- 背景＋白枠線 -->
          <rect width="24" height="24" fill="black" stroke="#ffffff" />

          <!-- 内向き矢印 -->
          <path d="M4 14h6v6M3 21l6.1-6.1M20 10h-6V4M21 3l-6.1 6.1" />
        </svg>
      </button>
    </div>

    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
