<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>画像一覧</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>

  <body>
    <header>
      <h1>画像一覧</h1>
      <p id="info"></p>

      <!-- フィルター -->
      <div class="filters">
        <div class="size-filter-row">
          <div class="size-filter-controls">
            <!-- TODO: 最小サイズフィルターの「現在適用中の閾値」を表示する UI を追加する
                 SVG/GIF はチェック状態で分かるため、最小サイズだけは明示表示したほうが理解しやすい -->
            <label class="size-filter-input">
              横
              <input
                type="number"
                id="min-width"
                min="0"
                step="1"
                value="0"
                inputmode="numeric"
              />
            </label>
            <label class="size-filter-input">
              縦
              <input
                type="number"
                id="min-height"
                min="0"
                step="1"
                value="0"
                inputmode="numeric"
              />
            </label>
            <button type="button" id="apply-size-filter">適用</button>
          </div>
        </div>
        <div>
          <label>
            <input type="checkbox" id="filter-svg" />
            SVG を非表示
          </label>
          <label>
            <input type="checkbox" id="filter-gif" />
            GIF を非表示
          </label>
        </div>
      </div>
    </header>

    <main>
      <!-- 画像を並べる領域 -->
      <section class="grid" id="grid"></section>
    </main>

    <div id="modal" class="hidden">
      <div id="overlay"></div>
      <img id="modal-img" />

      <!-- ✕ボタン -->
      <button id="close-btn">
        <svg
          id="close-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="square"
          stroke-linejoin="arcs"
        >
          <!-- 背景＋白枠線 -->
          <rect width="24" height="24" fill="black" stroke="#ffffff" />

          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- 拡大／縮小切り替え -->
      <button id="zoom-btn">
        <!-- 拡大アイコン -->
        <svg
          id="zoom-in-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="square"
          stroke-linejoin="arcs"
        >
          <!-- 背景＋白枠線 -->
          <rect width="24" height="24" fill="black" stroke="#ffffff" />

          <!-- 外向き矢印 -->
          <path d="M15 3h6v6M14 10l6.1-6.1M9 21H3v-6M10 14l-6.1 6.1" />
        </svg>

        <!-- 縮小アイコン -->
        <svg
          id="zoom-out-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="square"
          stroke-linejoin="arcs"
        >
          <!-- 背景＋白枠線 -->
          <rect width="24" height="24" fill="black" stroke="#ffffff" />

          <!-- 内向き矢印 -->
          <path d="M4 14h6v6M3 21l6.1-6.1M20 10h-6V4M21 3l-6.1 6.1" />
        </svg>
      </button>
    </div>

    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
